[package]
name = "smart-exam-converter"
version = "0.1.6"
description = "Convert scanned exams locally and synchronize them securely"
authors = ["Smart Exam Converter"]
edition = "2021"

[lib]
name = "smart_exam_converter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
keyring = { version = "3", features = ["windows-native"] }
ureq = "2"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
