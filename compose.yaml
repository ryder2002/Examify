name: smart-exam-converter

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Every backend role must run the exact same artifact.
x-backend-image: &backend-image
  image: ${BACKEND_IMAGE:-examify-backend:local}
  build:
    context: ./backend
    args:
      APP_REVISION: ${APP_REVISION:-unknown}

services:
  production-config-check:
    image: alpine:3.22
    restart: "no"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      TOKEN_EXPORT_SECRET: ${TOKEN_EXPORT_SECRET:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    command:
      - /bin/sh
      - -ec
      - |
        for name in REDIS_PASSWORD JWT_SECRET TOKEN_EXPORT_SECRET; do
          value=$$(printenv "$$name")
          test $${#value} -ge 24 || { echo "$$name phải có ít nhất 24 ký tự" >&2; exit 2; }
          case "$$value" in *replace*|*password*|*secret*) echo "$$name vẫn là placeholder" >&2; exit 2;; esac
        done
        test $${#ADMIN_PASSWORD} -ge 8 || { echo "ADMIN_PASSWORD phải có ít nhất 8 ký tự" >&2; exit 2; }
    network_mode: none
    logging: *default-logging

  postgres:
    build:
      context: ./deploy/postgres
    image: ${POSTGRES_IMAGE:-examify-postgres:local}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-examify}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-examify_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-80}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-6GB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-4MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=250
      - -c
      - log_lock_waits=on
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - pgbackrest_data:/var/lib/pgbackrest
      - ./deploy/pgbackrest.conf:/etc/pgbackrest.conf:ro
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 24
    mem_limit: 3584m
    cpus: "2.0"
    security_opt: [no-new-privileges:true]
    networks: [internal]
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 24
    mem_limit: 768m
    cpus: "0.75"
    security_opt: [no-new-privileges:true]
    networks: [internal]
    logging: *default-logging

  redis:
    image: redis:7.4.10-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    mem_limit: 384m
    cpus: "0.5"
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [internal]

  migrate:
    <<: *backend-image
    restart: "no"
    command:
      - /bin/sh
      - -ec
      - |
        export DATABASE_URL="$${MIGRATION_DATABASE_URL:-$${DATABASE_URL}}"
        alembic upgrade head
        python -m scripts.init_object_storage
    environment: &backend-env
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-1}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-5}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-10000}
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-2000}
      DB_IDLE_TRANSACTION_TIMEOUT_MS: ${DB_IDLE_TRANSACTION_TIMEOUT_MS:-15000}
      AUTH_VERIFY_CONCURRENCY: ${AUTH_VERIFY_CONCURRENCY:-4}
      PRESENCE_WRITE_INTERVAL_SECONDS: ${PRESENCE_WRITE_INTERVAL_SECONDS:-60}
      EXAM_MANIFEST_CACHE_TTL_SECONDS: ${EXAM_MANIFEST_CACHE_TTL_SECONDS:-600}
      EXAM_MANIFEST_CACHE_MAX_LOCAL: ${EXAM_MANIFEST_CACHE_MAX_LOCAL:-32}
      EXAM_MANIFEST_SINGLEFLIGHT_WAIT_SECONDS: ${EXAM_MANIFEST_SINGLEFLIGHT_WAIT_SECONDS:-8}
      MEDIA_AUTH_CACHE_TTL_SECONDS: ${MEDIA_AUTH_CACHE_TTL_SECONDS:-300}
      IDENTITY_WEBSOCKET_INTERVAL_SECONDS: ${IDENTITY_WEBSOCKET_INTERVAL_SECONDS:-15}
      PENDING_COMPONENT_RETENTION_HOURS: ${PENDING_COMPONENT_RETENTION_HOURS:-24}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?Set MINIO_ENDPOINT in .env}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_BUCKET_SOURCES: ${MINIO_BUCKET_SOURCES:-examify-sources}
      MINIO_BUCKET_ASSETS: ${MINIO_BUCKET_ASSETS:-examify-assets}
      MINIO_BUCKET_AUDIO: ${MINIO_BUCKET_AUDIO:-examify-audio}
      MINIO_BUCKET_ANSWERS: ${MINIO_BUCKET_ANSWERS:-examify-answers}
      MINIO_BUCKET_GUIDES: ${MINIO_BUCKET_GUIDES:-examify-guides}
      MINIO_ACCEL_REDIRECT_PREFIX: /_protected_minio
      CLASS_ASSET_TOKEN_MINUTES: ${CLASS_ASSET_TOKEN_MINUTES:-180}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}
      APP_PROFILE: ${APP_PROFILE:-server}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-90}
      TOKEN_EXPORT_SECRET: ${TOKEN_EXPORT_SECRET:?Set TOKEN_EXPORT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      AUTH_REQUIRED: "true"
      USE_CELERY: "true"
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-500}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://exam.congnhat.online}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://exam.congnhat.online,https://www.exam.congnhat.online,http://localhost,http://127.0.0.1}
      TOOL_TAO_DE_WORK_DIR: /tmp/smart-exam
      DICTIONARY_API_URL: ${DICTIONARY_API_URL:-https://api.dictionaryapi.dev}
      DICTIONARY_TRANSLATION_URL: ${DICTIONARY_TRANSLATION_URL:-https://api.mymemory.translated.net}
      DICTIONARY_EXAMPLES_URL: ${DICTIONARY_EXAMPLES_URL:-https://api.tatoeba.org}
      DICTIONARY_HTTP_TIMEOUT_SECONDS: ${DICTIONARY_HTTP_TIMEOUT_SECONDS:-8}
      DICTIONARY_CACHE_TTL_SECONDS: ${DICTIONARY_CACHE_TTL_SECONDS:-604800}
      DICTIONARY_NEGATIVE_CACHE_TTL_SECONDS: ${DICTIONARY_NEGATIVE_CACHE_TTL_SECONDS:-3600}
      MYMEMORY_CONTACT_EMAIL: ${MYMEMORY_CONTACT_EMAIL:-}
      LOCAL_DICTIONARY_PATH: /dictionary-data/en_vi.sqlite3
    depends_on:
      production-config-check:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal, egress]
    logging: *default-logging

  api:
    <<: *backend-image
    restart: unless-stopped
    command: ["/bin/sh", "-ec", "python scripts/build_local_dictionary.py; mkdir -p /tmp/prometheus; find /tmp/prometheus -type f -delete; exec uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4 --limit-concurrency 1200 --timeout-keep-alive 10"]
    environment:
      <<: *backend-env
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
      # Multipart bodies are already spooled by Starlette. Keep them on the
      # SSD-backed scratch volume instead of a small RAM tmpfs, then stream the
      # same file into MinIO without creating a second copy.
      TMPDIR: /scratch
      TOOL_TAO_DE_WORK_DIR: /scratch/smart-exam
      TOOL_TAO_DE_LOCAL_CACHE_MAX_BYTES: ${API_LOCAL_CACHE_MAX_BYTES:-2147483648}
      TOOL_TAO_DE_CACHE_EVICT_MIN_AGE_SECONDS: ${API_CACHE_EVICT_MIN_AGE_SECONDS:-900}
      # Keep 5 GiB free so three maximum-size teacher uploads plus temporary
      # MinIO transfer/OS activity still have recovery headroom.
      SCRATCH_MIN_FREE_BYTES: ${SCRATCH_MIN_FREE_BYTES:-5368709120}
      SCRATCH_MIN_FREE_PERCENT: ${SCRATCH_MIN_FREE_PERCENT:-5}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - dictionary_data:/dictionary-data
      - api_scratch:/scratch
    read_only: true
    tmpfs:
      # Upload spooling uses /scratch (SSD). This 1 GiB tmpfs is only fallback
      # headroom for libraries that still write to a hard-coded /tmp path.
      - /tmp:size=1G,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 2g
    cpus: "4.0"
    networks: [internal, egress]
    logging: *default-logging

  worker:
    <<: *backend-image
    restart: unless-stopped
    # OCR is server-side again. One bounded worker owns the queue while the
    # pipeline caps page/Tesseract parallelism to avoid CPU/RAM oversubscription.
    command:
      - /bin/sh
      - -ec
      - >-
        python -c 'import audio_processing, toeic_audio_cutter, pipeline, pytesseract, pdf2image, cv2' &&
        exec python -m celery -A celery_app.celery_app worker --pool=threads
        --concurrency=1 --loglevel=INFO --prefetch-multiplier=1 -Ofair
        --queues=ocr,media,documents --hostname=ocr-media@%h
    environment:
      <<: *backend-env
      DB_POOL_SIZE: 2
      DB_MAX_OVERFLOW: 0
      AUDIO_CUT_WORKERS: 1
      OCR_PAGE_WORKERS: ${OCR_PAGE_WORKERS:-2}
      OCR_ENGINE_POOL_SIZE: ${OCR_ENGINE_POOL_SIZE:-2}
      TESSERACT_TIMEOUT_SECONDS: ${TESSERACT_TIMEOUT_SECONDS:-120}
      OMP_THREAD_LIMIT: 1
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    tmpfs:
      - /tmp:size=1G,exec
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 1536m
    cpus: "2.0"
    networks: [internal, egress]
    logging: *default-logging

  maintenance-worker:
    <<: *backend-image
    restart: unless-stopped
    command: ["python", "-m", "celery", "-A", "celery_app.celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "--queues=maintenance", "--hostname=maintenance@%h"]
    environment:
      <<: *backend-env
      DB_POOL_SIZE: 2
      DB_MAX_OVERFLOW: 1
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 768m
    cpus: "0.5"
    networks: [internal, egress]
    logging: *default-logging

  scheduler:
    <<: *backend-image
    restart: unless-stopped
    command: ["python", "-m", "celery", "-A", "celery_app.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      <<: *backend-env
      DB_POOL_SIZE: 1
      DB_MAX_OVERFLOW: 1
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: "0.10"
    networks: [internal, egress]
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://api:8000
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:8000
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 600m
    cpus: "0.75"
    networks: [internal]
    logging: *default-logging

  nginx:
    image: nginx:1.28.3-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=128m,mode=1777
      - /var/run:size=16m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    mem_limit: 256m
    cpus: "0.5"
    networks: [public, internal, egress]
    logging: *default-logging

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --collector.long_running_transactions
      - --collector.stat_statements
      - --collector.stat_statements.limit=50
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN:-}
      PG_EXPORTER_COLLECTION_TIMEOUT: 10s
    mem_limit: 128m
    cpus: "0.15"
    security_opt: [no-new-privileges:true]
    networks: [internal, egress]
    logging: *default-logging

  redis-exporter:
    image: oliver006/redis_exporter:v1.88.0-alpine
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 96m
    cpus: "0.10"
    security_opt: [no-new-privileges:true]
    networks: [internal]
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.12.1
    profiles: [monitoring]
    restart: unless-stopped
    command: ["--path.rootfs=/host", "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"]
    volumes:
      - /:/host:ro,rslave
    pid: host
    mem_limit: 128m
    cpus: "0.15"
    security_opt: [no-new-privileges:true]
    networks: [internal]
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.13.2
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=5GB
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on: [api, postgres-exporter, redis-exporter, node-exporter]
    mem_limit: 1g
    cpus: "0.5"
    security_opt: [no-new-privileges:true]
    networks: [internal]
    logging: *default-logging

  monitoring-config-check:
    image: alpine:3.22
    profiles: [monitoring]
    restart: "no"
    environment:
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
    command: ["/bin/sh", "-ec", "test -n \"$$GRAFANA_ADMIN_PASSWORD\" && test \"$$GRAFANA_ADMIN_PASSWORD\" != 'replace-with-a-long-random-password' || { echo 'Set GRAFANA_ADMIN_PASSWORD before enabling monitoring' >&2; exit 2; }"]
    networks: [internal]

  grafana:
    image: grafana/grafana:13.0.6
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-invalid-until-config-check-passes}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:3001}
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3001}:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana-provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started
      monitoring-config-check:
        condition: service_completed_successfully
    mem_limit: 768m
    cpus: "0.35"
    security_opt: [no-new-privileges:true]
    networks: [internal]
    logging: *default-logging

volumes:
  postgres_data:
  pgbackrest_data:
  minio_data:
  redis_data:
  dictionary_data:
  api_scratch:
  certbot_webroot:
  letsencrypt_data:
  prometheus_data:
  grafana_data:

networks:
  public:
  internal:
    internal: true
  egress:
