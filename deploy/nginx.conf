resolver 127.0.0.11 valid=10s ipv6=off;

# Bound concurrent large multipart bodies globally. The OCR queue runs one
# inference job at a time because the external service uses all nine cores for
# a job; accepting an unbounded upload burst would only consume scratch/bandwidth.
limit_conn_zone $server_name zone=upload_global:1m;

# MinIO imports created before MIME metadata was normalized can return
# application/octet-stream.  Class assets use opaque UUID URLs, so derive the
# browser-facing type from the protected object path instead.
map $uri $protected_minio_content_type {
    default application/octet-stream;
    ~*\.webp$ image/webp;
    ~*\.png$ image/png;
    ~*\.jpe?g$ image/jpeg;
    ~*\.gif$ image/gif;
    ~*\.svg$ image/svg+xml;
    ~*\.mp3$ audio/mpeg;
    ~*\.m4a$ audio/mp4;
    ~*\.aac$ audio/aac;
    ~*\.wav$ audio/wav;
    ~*\.ogg$ audio/ogg;
    ~*\.oga$ audio/ogg;
    ~*\.webm$ audio/webm;
    ~*\.flac$ audio/flac;
    ~*\.pdf$ application/pdf;
}

upstream smart_exam_api {
    zone smart_exam_api 64k;
    server api:8000 resolve;
    keepalive 32;
}

upstream smart_exam_frontend {
    zone smart_exam_frontend 64k;
    server frontend:3000 resolve;
    keepalive 16;
}

upstream smart_exam_minio {
    zone smart_exam_minio 64k;
    server minio:9000 resolve;
    keepalive 64;
}

server {
    listen 80;
    server_name exam.congnhat.online www.exam.congnhat.online _;
    server_tokens off;
    client_max_body_size 2m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Request-ID $request_id always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location = /health {
        proxy_pass http://smart_exam_api/health/live;
        proxy_set_header Host $host;
    }

    # Dependency readiness is intentionally separate from the lightweight
    # liveness probe.  Expose it through Nginx so LAN deployments can verify
    # Tesseract/PostgreSQL/MinIO/Redis without bypassing the reverse proxy.
    location = /health/ready {
        proxy_pass http://smart_exam_api/health/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /openapi.json {
        return 404;
    }

    location = /docs {
        return 404;
    }

    location ~ ^/api/v1/(activations/redeem|desktop/activate)$ {
        proxy_pass http://smart_exam_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location ~ ^/api/v1/(desktop/)?auth/(login|register|refresh)$ {
        proxy_pass http://smart_exam_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /api/extractions {
        # Backend accepts PDF 50 MiB plus up to 300 MiB of audio and multipart
        # overhead. Keep this route aligned without relaxing other API routes.
        client_max_body_size 360m;
        limit_conn upload_global 4;
        limit_conn_status 503;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_pass http://smart_exam_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location ~ ^/api/extractions/[^/]+/answer-key-image$ {
        client_max_body_size 12m;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_pass http://smart_exam_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /api/v1/admin/guide-media/upload {
        client_max_body_size 210m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://smart_exam_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /api/v1/desktop/sync/exams {
        client_max_body_size 10m;
        proxy_read_timeout 120s;
        proxy_pass http://smart_exam_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location ~ ^/api/v1/desktop/sync/exams/[^/]+/assets/[^/]+$ {
        client_max_body_size 60m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://smart_exam_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location /api/extractions/ {
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_pass http://smart_exam_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location /api/v1/ws/ {
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://smart_exam_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Request-ID $request_id;
    }

    # Authorized classroom media is internally redirected here by FastAPI.
    # The location is unreachable from a browser directly, so MinIO stays private
    # while nginx, rather than a Python worker, carries Range/audio response bytes.
    location /_protected_minio/ {
        internal;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_force_ranges on;
        proxy_hide_header Content-Type;
        default_type $protected_minio_content_type;
        proxy_pass http://smart_exam_minio/;
        # Must match MINIO_ENDPOINT because the SigV4 URL is signed for this Host.
        proxy_set_header Host minio:9000;
        proxy_set_header Connection "";
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        proxy_pass http://smart_exam_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location /api/v1/student/attempts/ {
        client_max_body_size 64k;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_pass http://smart_exam_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location /api/v1/attempts/ {
        client_max_body_size 64k;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_pass http://smart_exam_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location /api/v1/class-session/attempts/ {
        client_max_body_size 64k;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_pass http://smart_exam_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_pass http://smart_exam_frontend;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://smart_exam_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Request-ID $request_id;
    }
}
