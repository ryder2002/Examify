global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: examify
    environment: production

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    metrics_path: /internal/metrics
    static_configs:
      - targets: [api:8000]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: host
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: [minio:9000]
