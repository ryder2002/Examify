<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#1f4e79" />
    <title>Examify · Đang offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f8fb;color:#0f172a;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}.card{width:min(100%,440px);padding:32px;border:1px solid #dbe4ec;border-radius:24px;background:#fff;text-align:center;box-shadow:0 18px 50px rgba(31, 78, 121,.12)}img{width:88px;height:88px;border-radius:20px}.brand{margin:12px 0 0;color:#1f4e79;font-size:28px;font-weight:850}.message{margin:16px 0 24px;color:#475569;line-height:1.6}.retry{display:inline-flex;min-height:44px;align-items:center;justify-content:center;border:0;border-radius:12px;background:#1f4e79;color:#fff;font:700 15px inherit;padding:11px 20px;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/logo.png" alt="Examify" />
      <h1 class="brand">Examify</h1>
      <p class="message">Thiết bị đang mất kết nối. Hãy kiểm tra mạng rồi thử lại. Dữ liệu bài làm đã lưu trên thiết bị sẽ tiếp tục đồng bộ khi có internet.</p>
      <button class="retry" type="button" onclick="location.reload()">Thử kết nối lại</button>
    </main>
  </body>
</html>
